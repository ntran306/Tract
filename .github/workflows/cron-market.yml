name: Refresh market data

on:
  schedule:
    # FHFA HPI publishes quarterly; run early in the first month of each quarter.
    - cron: "0 7 5 1,4,7,10 *"
    # HUD FMR publishes yearly (effective Oct 1); refresh in October.
    - cron: "0 7 10 10 *"
  workflow_dispatch: # manual trigger for both

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./backend
      - name: Refresh FHFA HPI (free, no key)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m workers.jobs.refresh_hpi
      - name: Refresh HUD FMR (needs HUD_API_TOKEN)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
        run: python -m workers.jobs.refresh_fmr
